# conda / mamba environment for the mother machine pipeline
#   conda env create -f environment.yml
#   conda activate mothermachine
name: mothermachine
channels:
  - conda-forge
  - nodefaults        # only conda-forge (no terms of service to accept for the Anaconda channels)
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt
